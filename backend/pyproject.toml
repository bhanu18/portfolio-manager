[project]
name = "portfolio-dashboard-api"
version = "1.0.0"
description = "FastAPI backend for Portfolio Dashboard"
requires-python = ">=3.12,<3.13"

# ---------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["venv", "alembic/versions"]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # isort
  "UP",       # pyupgrade
  "B",        # bugbear
  "SIM",      # simplify
  "DTZ",      # timezone-aware datetimes
  "E722",     # bare except
  "RUF",
]
ignore = [
  "B008",     # FastAPI Depends()/Query() in defaults is idiomatic
  "E501",     # line length handled by formatter
  "RUF001", "RUF002", "RUF003",  # unicode in strings/comments
  "UP042",    # (str, Enum) -> StrEnum changes str() output; revisit deliberately
  "DTZ003",   # utcnow(): switching to aware datetimes needs a DB/column review first
]

[tool.ruff.lint.isort]
known-first-party = ["core", "db", "models", "routers", "service"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
files = ["main.py", "core", "db", "models", "routers", "service"]
explicit_package_bases = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
exclude = ["^venv/", "^alembic/versions/"]

# Legacy SQLAlchemy 1.x-style models (Column(...) without Mapped[] annotations) are
# opaque to mypy. Migrating db/orm_models.py to `Mapped[...]` removes the need for this.
[[tool.mypy.overrides]]
module = ["db.orm_models", "db.service"]
disable_error_code = ["valid-type", "misc", "var-annotated", "assignment", "arg-type"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
