steps:
  # 1. Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/portfolio-tracker:$COMMIT_SHA', '.']

  # 2. Push the image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/portfolio-tracker:$COMMIT_SHA']

  # 3. Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'portfolio-tracker'
      - '--image'
      - 'gcr.io/$PROJECT_ID/portfolio-tracker:$COMMIT_SHA'
      - '--region'
      - 'asia-southeast1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--timeout'
      - '300'
      - '--max-instances'
      - '10'
      - '--min-instances'
      - '0'
      # Connect to Cloud SQL MySQL instance
      - '--add-cloudsql-instances'
      - '$_CLOUDSQL_INSTANCE'
      # Environment variables from Secret Manager
      - '--update-secrets'
      - 'DATABASE_URL=DATABASE_URL:latest'
      - '--update-secrets'
      - 'SYNC_DATABASE_URL=SYNC_DATABASE_URL:latest'
      - '--update-secrets'
      - 'SECRET_KEY=SECRET_KEY:latest'
      - '--update-secrets'
      - 'SMTP_PASSWORD=SMTP_PASSWORD:latest'
      # Regular environment variables
      - '--set-env-vars'
      - 'SMTP_HOST=${_SMTP_HOST}'
      - '--set-env-vars'
      - 'SMTP_PORT=${_SMTP_PORT}'
      - '--set-env-vars'
      - 'SMTP_USER=${_SMTP_USER}'
      - '--set-env-vars'
      - 'EMAIL_FROM=${_EMAIL_FROM}'

images:
  - 'gcr.io/$PROJECT_ID/portfolio-tracker:$COMMIT_SHA'

# Substitution variables (configure in Cloud Build trigger)
substitutions:
  _CLOUDSQL_INSTANCE: 'YOUR_PROJECT_ID:asia-southeast1:portfolio-tracker-mysql'
  _SMTP_HOST: 'smtp.gmail.com'
  _SMTP_PORT: '587'
  _SMTP_USER: 'your-email@gmail.com'
  _EMAIL_FROM: 'your-email@gmail.com'

options:
  logging: CLOUD_LOGGING_ONLY